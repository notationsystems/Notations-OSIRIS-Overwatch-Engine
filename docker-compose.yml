name: payload
services:
  payload:
    # Builds locally from the Dockerfile so you always run the cloned code.
    # To use the prebuilt image instead, replace the `build:` block below with
    # `image: ghcr.io/simplifaisoul/osiris:latest`.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payload
    # Host port is configurable via PAYLOAD_PORT in .env (defaults to 3000).
    # OSIRIS_PORT is honoured for one release so a running deployment does
    # not break on the rename; it stops being read after v0.2.0.
    ports:
      - "${PAYLOAD_PORT:-${OSIRIS_PORT:-3000}}:3000"
    # Optional freight authority, carrier adapter, and feed keys — copy
    # .env.example to .env and fill in what you need. Missing file is ignored.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PAYLOAD_OPERATIONS_LOG=${PAYLOAD_OPERATIONS_LOG:-/app/runtime-data/load-operations.jsonl}
      - PAYLOAD_CARRIER_COMMUNICATIONS_LOG=${PAYLOAD_CARRIER_COMMUNICATIONS_LOG:-/app/runtime-data/carrier-communications.jsonl}
      - PAYLOAD_PROCUREMENT_LOG=${PAYLOAD_PROCUREMENT_LOG:-/app/runtime-data/procurement.jsonl}
      - PAYLOAD_COMMERCIAL_LOG=${PAYLOAD_COMMERCIAL_LOG:-/app/runtime-data/commercial.jsonl}
      - PAYLOAD_DATABASE_PATH=${PAYLOAD_DATABASE_PATH:-}
    volumes:
      - payload-runtime:/app/runtime-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - umami_default

  payload-cache:
    image: nginx:alpine
    container_name: payload-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - payload
    restart: unless-stopped
    networks:
      - default

  payload-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: payload-intel
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - default

volumes:
  nginx-cache:
  payload-runtime:

networks:
  umami_default:
    external: true

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: payload
  author: simplifaisoul
  developer: simplifaisoul
  category: Productivity
  description:
    en_us: >-
      Payload is a freight and physical-commerce instrument. It holds a
      provenance-preserving world state for loads, lanes, carriers and
      commitments, in which every figure carries its source, its basis and
      the date it became knowable, and an unanswerable question returns a
      typed refusal rather than a zero. Commodity and freight verticals run
      on one substrate, rendered on a GPU-accelerated MapLibre interface.
      Most features work with no API keys.
  tagline:
    en_us: Freight and physical-commerce operating system
  title:
    en_us: Payload
  icon: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client id for higher aircraft rate limits."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."
    - container: N2YO_API_KEY
      description:
        en_us: "(Optional) N2YO key for satellite tracking."
    - container: FMCSA_WEB_KEY
      description:
        en_us: "FMCSA QCMobile WebKey for USDOT carrier authority and operating-status pulls."
    - container: EIA_API_KEY
      description:
        en_us: "EIA Open Data key for the weekly U.S. diesel benchmark."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
